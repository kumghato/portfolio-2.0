  <circle cx="40" cy="40" r="34" stroke="#858b73" stroke-width="0.8" opacity="0.6" />
  <circle cx="40" cy="40" r="26" stroke="#1a1a1a" stroke-width="0.75" />
  <circle cx="40" cy="40" r="24.5" stroke="#858b73" stroke-width="0.5" stroke-dasharray="1.5 1.5" />
  
